# Web demo → GitHub Pages. Builds the browser-only bundle (frontend: npm run build:web →
# dist-web, incl. svelte-check) and publishes it at
#   https://clinical-pharmacy-saarland-university.github.io/pi_pumpsim/
# Going live is a repo setting, not a code change: the deploy job is skipped until Pages is
# enabled (Settings → Pages → Source: "GitHub Actions"). Until then pushes and PRs just build.
name: web-demo

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/web-demo.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/web-demo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-web

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.has_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
